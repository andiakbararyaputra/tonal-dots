[accessibility]
ui_scale = 1.20

[bar.default]
background_opacity = 0.45
capsule = true
capsule_border = "outline_variant"
capsule_border_width = 1.0
capsule_fill = "surface_container"
capsule_opacity = 0.55
center = [ "workspaces" ]
compositor_blur = true
concave_edge_corners = false
end = [ "media", "tray", "group:g2", "session" ]
margin_edge = 6
margin_ends = 8
radius_bottom_left = 14
radius_bottom_right = 14
radius_top_left = 14
radius_top_right = 14
scale = 1.10
shadow = true
start = [ "deskclock_primary", "deskclock_secondary" ]
thickness = 35

    [[bar.default.capsule_group]]
    border = "outline_variant"
    fill = "surface_container"
    id = "g2"
    members = [ "notifications", "network", "battery" ]
    opacity = 0.55
    padding = 8.0
    widget_spacing = 10

[shell]
clipboard_image_action_command = "satty -f -"
corner_radius_scale = 1.3
font_family = "Adwaita Sans"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = true
    category_icons_only = true
    compact = true
    layout = "simple"
    pinned = [ "firefox", "code-oss", "hayase", "google-chrome" ]
    show_app_origin_indicator = false

    [shell.panel]
    list_item_background = true
    open_near_click_control_center = false
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [shell.screen_corners]
    enabled = true
    size = 14

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[lockscreen]
blur_intensity = 0.8
blurred_desktop = true
edge_smoothness = 0.6
tint_intensity = 0.45
transition = [ "fade", "zoom" ]
transition_duration = 900

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lock_time_edp", "lock_date_edp", "lock_login_edp", "lock_time_hdmi", "lock_date_hdmi", "lock_login_hdmi" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget.lock_time_edp]
    box_height = 160.0
    box_width = 480.0
    cx = 640.0
    cy = 250.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lock_time_edp.settings]
        background = false
        center_text = true
        color = "on_surface"
        font_family = "JetBrainsMono Nerd Font Propo"
        format = "{:%H:%M}"
        shadow = true

    [lockscreen_widgets.widget.lock_date_edp]
    box_height = 40.0
    box_width = 400.0
    cx = 640.0
    cy = 350.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lock_date_edp.settings]
        background = false
        center_text = true
        color = "primary"
        font_family = "JetBrainsMono Nerd Font Propo"
        format = "{:%A, %d %B}"
        shadow = true

    [lockscreen_widgets.widget.lock_login_edp]
    box_height = 196.0
    box_width = 620.0
    cx = 640.0
    cy = 560.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget.lock_login_edp.settings]
        background_color = "surface"
        background_opacity = 0.35
        background_radius = 28.0
        center_password_text = true
        input_opacity = 0.55
        input_radius = 20.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lock_time_hdmi]
    box_height = 480.0
    box_width = 1440.0
    cx = 1920.0
    cy = 750.0
    output = "HDMI-A-2"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lock_time_hdmi.settings]
        background = false
        center_text = true
        color = "on_surface"
        font_family = "JetBrainsMono Nerd Font Propo"
        format = "{:%H:%M}"
        shadow = true

    [lockscreen_widgets.widget.lock_date_hdmi]
    box_height = 120.0
    box_width = 1200.0
    cx = 1920.0
    cy = 1050.0
    output = "HDMI-A-2"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lock_date_hdmi.settings]
        background = false
        center_text = true
        color = "primary"
        font_family = "JetBrainsMono Nerd Font Propo"
        format = "{:%A, %d %B}"
        shadow = true

    [lockscreen_widgets.widget.lock_login_hdmi]
    box_height = 196.0
    box_width = 810.0
    cx = 1920.0
    cy = 1680.0
    output = "HDMI-A-2"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget.lock_login_hdmi.settings]
        background_color = "surface"
        background_opacity = 0.35
        background_radius = 28.0
        center_password_text = true
        input_opacity = 0.55
        input_radius = 20.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

[idle]
behavior_order = [ "lock", "screen-off", "suspend-on-battery" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 360

    # Noctalia has no AC/battery condition, so check the adapter here
    [idle.behavior.suspend-on-battery]
    action = "command"
    command = "[ \"$(cat /sys/class/power_supply/ADP1/online)\" = 0 ] && systemctl suspend"
    enabled = true
    timeout = 900

[hooks]
battery_percentage_changed = "~/.config/noctalia/hooks/battery-threshold.sh"

[desktop_widgets]
enabled = true
widget_order = [ "deskclock", "audio_wave_edp", "audio_wave_hdmi" ]

    [desktop_widgets.widget.audio_wave_edp]
    box_height = 96.0
    box_width = 1280.0
    cx = 640.0
    cy = 672.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        # Hex with alpha for transparency; mirrors the current primary/secondary palette
        [desktop_widgets.widget.audio_wave_edp.settings]
        background = false
        centered = false
        color_1 = "#a0cafd59"
        color_2 = "#bbc7db59"
        mirrored = true
        show_wave = false
        show_when_idle = true

    [desktop_widgets.widget.audio_wave_hdmi]
    box_height = 240.0
    box_width = 3840.0
    cx = 1920.0
    cy = 2040.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.audio_wave_hdmi.settings]
        background = false
        centered = false
        color_1 = "#a0cafd59"
        color_2 = "#bbc7db59"
        mirrored = true
        show_wave = false
        show_when_idle = true

    [desktop_widgets.widget.deskclock]
    box_height = 200.0
    box_width = 460.0
    cx = 640.0
    cy = 210.0
    output = "eDP-1"
    type = "andiakbar/deskclock:clock"

        [desktop_widgets.widget.deskclock.settings]
        background = false

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty", "hyprland" ]

[widget.clock]
font_family = "JetBrainsMono Nerd Font Propo"
font_weight = 600
format = "{:%a, %d/%m/%y %H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.notifications]
hide_when_no_unread = true

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.sysmon_2]
glyph = "cpu-usage"
stat = "cpu_usage"
type = "sysmon"
visualization = "none"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.volume]
color = "secondary"

[widget.deskclock_primary]
type = "andiakbar/deskclock:primary"

[widget.deskclock_secondary]
type = "andiakbar/deskclock:secondary"

[widget.workspaces]
active_pill_size = 2.5
empty_color = "on_surface"
inactive_pill_size = 1.0
occupied_color = "on_surface"
pill_scale = 0.80
show_icons = true
show_labels = false
style = "focus_hint"
